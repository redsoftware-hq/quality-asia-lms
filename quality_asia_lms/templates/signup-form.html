<style>
    .signup-form .form-label {
        display: block;
        text-align: left;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 4px;
    }
    .signup-form .reqd-star {
        color: #e20a0a;
    }
    .signup-form input[type="file"].form-control {
        height: auto;
        line-height: 1.6;
        padding-top: 7px;
        padding-bottom: 7px;
    }
    .signup-form .file-hint {
        display: block;
        text-align: left;
        font-size: 11px;
        color: #888;
        margin-top: 2px;
    }
    .signup-form .file-err {
        display: none;
        text-align: left;
        font-size: 11px;
        color: #e20a0a;
        margin-top: 2px;
    }
</style>

<form class="signup-form" role="form">
    <div class="page-card-body">
        <div class="form-group">
            <label class="form-label" for="signup_fullname">{{ _("Full Name") }} <span class="reqd-star">*</span></label>
            <input type="text" id="signup_fullname" class="form-control"
                placeholder="{{ _('Full Name') }}" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label" for="signup_email">{{ _("Email ID") }} <span class="reqd-star">*</span></label>
            <input type="email" id="signup_email" class="form-control"
                placeholder="{{ _('Email ID') }}" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="signup_mobile">{{ _("Mobile Number") }} <span class="reqd-star">*</span></label>
            <input type="tel" id="signup_mobile" class="form-control"
                placeholder="{{ _('Mobile Number') }}" pattern="[+0-9\s\-]{7,20}" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="signup_company">{{ _("Company Name") }}</label>
            <input type="text" id="signup_company" class="form-control"
                placeholder="{{ _('Company Name (optional)') }}">
        </div>
        <div class="form-group">
            <label class="form-label" for="signup_address">{{ _("Residential Address") }}</label>
            <textarea id="signup_address" class="form-control" rows="2"
                placeholder="{{ _('Residential Address (optional)') }}"></textarea>
        </div>
        <div class="form-group">
            <label class="form-label" for="signup_photo">{{ _("Profile Photo") }}</label>
            <input type="file" id="signup_photo" class="form-control" accept=".jpg,.jpeg,.png,.webp">
            <small class="file-hint">{{ _("JPG / PNG / WEBP, up to 2 MB (optional)") }}</small>
            <small class="file-err" id="signup_photo_err"></small>
        </div>
        <div class="form-group">
            <label class="form-label" for="signup_resume">{{ _("Resume / CV") }}</label>
            <input type="file" id="signup_resume" class="form-control" accept=".pdf,.doc,.docx">
            <small class="file-hint">{{ _("PDF / DOC / DOCX, up to 5 MB (optional)") }}</small>
            <small class="file-err" id="signup_resume_err"></small>
        </div>
    </div>
    <div class="page-card-actions">
        <button class="btn btn-sm btn-primary btn-block btn-signup"
            type="submit">{{ _("Sign up") }}</button>

        <p class="text-center sign-up-message">
            <a href="#login" class="blue">{{ _("Have an account? Login") }}</a>
        </p>
    </div>
</form>

<script>
    frappe.ready(function () {
        $(".signup-form").on("submit", (e) => {
            signup(e);
        });
    });

    const PHOTO_RE = /\.(jpe?g|png|webp)$/i;
    const RESUME_RE = /\.(pdf|docx?)$/i;
    const MAX_PHOTO_MB = 2;
    const MAX_RESUME_MB = 5;

    // Returns null if ok, else a user-facing error string.
    const check_file = (file, re, max_mb) => {
        if (!re.test(file.name)) return '{{ _("This file type isn't supported. Please choose a different file.") }}';
        if (file.size > max_mb * 1024 * 1024) {
            return '{{ _("This file is too large. Maximum size is ") }}' + max_mb + ' MB.';
        }
        return null;
    };

    const show_file_err = (el_id, msg) => {
        const el = document.getElementById(el_id);
        if (!el) return;
        if (msg) { el.textContent = msg; el.style.display = "block"; }
        else { el.textContent = ""; el.style.display = "none"; }
    };

    // Read a File as bare base64 (strips the "data:...;base64," prefix).
    const read_base64 = (file) => new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result).split(",")[1] || "");
        r.onerror = () => reject(r.error);
        r.readAsDataURL(file);
    });

    const signup = async (e) => {
        e.preventDefault();
        const email = ($("#signup_email").val() || "").trim();
        const full_name = frappe.utils.xss_sanitise(($("#signup_fullname").val() || "").trim());
        const mobile_no = ($("#signup_mobile").val() || "").trim();
        const company_name = ($("#signup_company").val() || "").trim();
        const address = ($("#signup_address").val() || "").trim();

        if (!email || !validate_email(email) || !full_name) {
            login.set_status('{{ _("Please enter your name and a valid email address.") }}', 'red');
            return false;
        }

        const digits = mobile_no.replace(/\D/g, "");
        if (digits.length < 7 || digits.length > 15) {
            login.set_status('{{ _("Please enter a valid mobile number.") }}', 'red');
            return false;
        }

        const photo_file = ($("#signup_photo")[0].files || [])[0];
        const resume_file = ($("#signup_resume")[0].files || [])[0];

        const photo_err = photo_file ? check_file(photo_file, PHOTO_RE, MAX_PHOTO_MB) : null;
        const resume_err = resume_file ? check_file(resume_file, RESUME_RE, MAX_RESUME_MB) : null;
        show_file_err("signup_photo_err", photo_err);
        show_file_err("signup_resume_err", resume_err);
        if (photo_err || resume_err) return false;

        const args = {
            "email": email,
            "full_name": full_name,
            "mobile_no": mobile_no,
            "company_name": company_name,
            "address": address
        };
        try {
            if (photo_file) {
                args.photo_filename = photo_file.name;
                args.photo_content = await read_base64(photo_file);
            }
            if (resume_file) {
                args.resume_filename = resume_file.name;
                args.resume_content = await read_base64(resume_file);
            }
        } catch (err) {
            login.set_status('{{ _("We couldn't read the uploaded file. Please try a different one.") }}', 'red');
            return false;
        }

        login.set_status('{{ _("Creating your account...") }}', 'blue');
        frappe.call({
            method: "quality_asia_lms.overrides.signup.sign_up",
            args: args,
            callback: function(r) {
                if (!r.message) return;
                var code = cint(r.message[0]);
                var msg = r.message[1];
                if (code === 0) {
                    // Enabled existing user — welcome back + reset link.
                    login.set_status('{{ _("Sign up") }}', 'blue');
                    frappe.msgprint({
                        title: '{{ _("Welcome Back!") }}',
                        indicator: 'blue',
                        message: msg + ' <a href="#forgot">{{ _("Reset your password") }}</a>'
                    });
                } else if (code === 2) {
                    // Disabled account (placeholder) — contact admin, no reset link.
                    login.set_status('{{ _("Sign up") }}', 'blue');
                    frappe.msgprint({
                        title: '{{ _("Almost There!") }}',
                        indicator: 'yellow',
                        message: msg
                    });
                } else {
                    login.set_status('{{ _("You're all set!") }}', 'green');
                    frappe.msgprint(msg);
                }
            },
            error: function() {
                login.set_status('{{ _("Sign up") }}', 'blue');
            }
        })
        return false;
    }
</script>
